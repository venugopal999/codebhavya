<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Searching | Data Structures | CodeBhavya</title>
<link href="../images/codebhavya-icon-32.png" rel="icon" type="image/png"/>
<link href="../style.css" rel="stylesheet"/>
<style>
/* Your existing styles preserved */
.program-box { margin: 18px 0; }
.program-toggle { background:#2563eb; color:#fff; border:none; padding:9px 16px; border-radius:7px; cursor:pointer; font-weight:600; }
.program-toggle:hover { background:#1d4ed8; }
.program-content { display:none; margin-top:12px; }
.program-content.open { display:block; }
.tracer-panel { display:flex; gap:20px; flex-wrap:wrap; }
.tracer-panel > div { flex:1; min-width:280px; border:1px solid #e2e8f0; padding:10px; border-radius:8px; }
.highlight { background:#ffff99; }
</style>
</head>
<body>

<header>
  <!-- your header/navigation -->
</header>

<main>
  <h1>Searching Algorithms</h1>
  <p>Welcome to the searching section of Data Structures.</p>

  <!-- === Linear Search Tracer === -->
  <div class="program-box">
    <button class="program-toggle" onclick="tracer.toggle()">Show Linear Search Tracer</button>
    <div id="tracer-box" class="program-content">
      <h3>PROGRAM TRACING</h3>
      <div class="tracer-panel">
        <div>
          <h4>Program</h4>
          <pre id="tracer-code"></pre>
        </div>
        <div>
          <h4>Trace</h4>
          <p><b>📘 Explanation:</b> <span id="tracer-explain"></span></p>
          <p><b>⚡ State:</b></p>
          <pre id="tracer-state"></pre>
        </div>
      </div>
      <div style="margin-top:15px; text-align:center;">
        <button onclick="tracer.prev()">← Previous</button>
        <button onclick="tracer.reset()">Reset</button>
        <button onclick="tracer.next()">Next →</button>
      </div>
    </div>
  </div>

</main>

<footer>
  <!-- your footer -->
</footer>

<script>
const tracer = {
  steps: [],
  state: {},
  current: 0,
  init(steps) {
    this.steps = steps;
    this.state = {};
    this.current = 0;
    this.render();
  },
  runStep() {
    this.steps[this.current].run(this.state);
  },
  render() {
    const codeEl = document.getElementById("tracer-code");
    codeEl.innerHTML = this.steps.map((s,i)=>
      (i===this.current ? "👉 " : "   ") + s.code
    ).join("\n");
    document.getElementById("tracer-explain").textContent = this.steps[this.current].explain;
    document.getElementById("tracer-state").textContent = JSON.stringify(this.state,null,2);
  },
  next() {
    if(this.current < this.steps.length) {
      this.runStep();
      this.render();
      this.current++;
    }
  },
  prev() {
    if(this.current > 0) {
      this.current--;
      this.state = {};
      for(let i=0;i<this.current;i++) this.steps[i].run(this.state);
      this.render();
    }
  },
  reset() {
    this.current = 0;
    this.state = {};
    this.render();
  },
  toggle() {
    document.getElementById("tracer-box").classList.toggle("open");
  },
  jumpTo(idx) {
    this.current = idx;
    this.render();
  }
};

// Define linear search steps with loop execution
const steps = [
  { code:"int arr[] = {5,2,8,1};", run:s=>{s.arr=[5,2,8,1];}, explain:"Initialize array." },
  { code:"int key = 8;", run:s=>{s.key=8;}, explain:"Set search key." },
  { code:"for(int i=0; i<4; i++){", run:s=>{s.i=0;}, explain:"Start loop." },
  { code:"   if(arr[i] == key){", run:s=>{s.check=(s.arr[s.i]===s.key);}, explain:"Check element." },
  { code:"       // Found element", run:s=>{if(s.check) s.found=true;}, explain:"If true, found." },
  { code:"   }", run:s=>{}, explain:"End if." },
  { code:"}", run:s=>{
      s.i++;
      if(s.i < s.arr.length) tracer.jumpTo(3);
    }, explain:"End loop iteration."
  }
];

tracer.init(steps);
</script>

</body>
</html>
