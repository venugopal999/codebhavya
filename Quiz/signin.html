<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Sign In | CodeBhavya</title><link rel="stylesheet" href="quiz.css?v=8">
<script src="../Placement/supabase-config.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../Placement/supabase-client.js?v=1"></script>
</head><body>
<header class="topbar"><a class="brand" href="../">Code<span>Bhavya</span></a><nav><a href="../Placement/">Placement</a><a href="./">Quiz Arena</a></nav></header>
<main class="shell narrow"><section class="panel auth-card">
<span class="eyebrow dark">CODEBHAVYA ACCOUNT</span><h1>Sign in for Quiz Arena</h1>
<p class="muted">Use the same CodeBhavya account you use in Placement. The session is shared across the website.</p>
<div class="auth-tabs"><button class="btn primary" id="signInTab">Sign In</button><button class="btn ghost" id="signUpTab">Create Account</button></div>
<form id="authForm">
<div id="nameField" hidden><label>Your name</label><input class="input" id="displayName" maxlength="80" autocomplete="name"></div>
<label>Email address</label><input class="input" id="email" type="email" autocomplete="email" required>
<label>Password</label><input class="input" id="password" type="password" minlength="8" autocomplete="current-password" required>
<div class="actions"><button class="btn gold" id="authSubmit" type="submit">Sign in securely</button><a class="btn ghost" href="../Placement/index.html#cloudProgress">Use Placement sign-in</a></div>
<div id="authMessage"></div>
</form>
</section></main>
<script src="quiz-common.js?v=8"></script><script src="signin.js?v=8"></script>
</body></html>
