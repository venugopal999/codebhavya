<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Quiz | CodeBhavya</title><link rel="stylesheet" href="../quiz.css?v=2">
<script src="../../Placement/supabase-config.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../Placement/supabase-client.js?v=1"></script></head><body>
<header class="topbar"><a class="brand" href="index.html">Code<span>Bhavya</span> Quiz Admin</a><nav><a href="index.html">Dashboard</a><a href="faculty.html">Faculty Accounts</a></nav></header>
<main class="shell">
<div class="grid">
<section class="panel col-5"><h1>Edit Quiz</h1><div id="editStatus"></div>
<label>Quiz title</label><input class="input" id="title">
<label>Course / Class</label><input class="input" id="course">
<label>Duration (minutes)</label><input class="input" id="duration" type="number" min="1" max="180">
<label>Show score</label><select id="showResult"><option value="after_close">After faculty closes quiz</option><option value="immediate">Immediately after submit</option><option value="faculty_only">Faculty only</option></select>
<div class="two"><label><input type="checkbox" id="shuffleQuestions"> Shuffle questions</label><label><input type="checkbox" id="shuffleOptions"> Shuffle options</label></div>
<div class="actions"><button class="btn primary" id="saveQuizBtn">Save Quiz Settings</button><a class="btn ghost" id="controlLink">Control Page</a></div>
</section>
<section class="panel col-7"><div class="section-head"><div><h2>Questions</h2><p class="muted">Add, edit or remove questions until the quiz starts.</p></div><button class="btn gold" id="newQuestionBtn">+ Add Question</button></div><div id="questionList">Loading…</div></section>
<section class="panel col-12" id="editorPanel"><h2 id="editorTitle">Add Question</h2>
<label>Question</label><textarea id="qText"></textarea><label>Marks</label><input class="input" id="qMarks" type="number" min="1" max="100" value="1"><div id="optionEditor"></div>
<div class="actions"><button class="btn ghost" id="addOptionBtn">+ Option</button><button class="btn teal" id="saveQuestionBtn">Save Question</button><button class="btn ghost" id="cancelEditBtn">Cancel</button></div></section>
</div></main>
<script src="../quiz-common.js?v=2"></script><script src="edit.js?v=2"></script>
</body></html>
