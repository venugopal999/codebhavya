<!doctype html><html><head>
<meta name="robots" content="noindex,follow">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edit Quiz | CodeBhavya</title><link rel="stylesheet" href="../quiz.css?v=15">
<script src="../../Placement/supabase-config.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../Placement/supabase-client.js?v=1"></script></head><body>
<header class="topbar"><a class="brand" href="index.html">Code<span>Bhavya</span> Quiz Admin</a><nav><a href="index.html">Dashboard</a><a href="bank.html">Question Bank</a><a href="faculty.html">Faculty Accounts</a></nav></header>
<main class="shell"><div class="grid">
<section class="panel col-5"><h1>Edit Quiz</h1><div id="editStatus"></div>
<label>Quiz title</label><input class="input" id="title"><label>Course / Class</label><input class="input" id="course"><label>Duration (minutes)</label><input class="input" id="duration" type="number" min="1" max="180">
<label>Start mode</label><select id="startMode"><option value="manual">Manual</option><option value="scheduled">Scheduled</option></select><div id="scheduleFields" hidden><label>Scheduled start</label><input class="input" id="scheduledStart" type="datetime-local"></div>
<label>Show score</label><select id="showResult"><option value="after_close">After faculty closes quiz</option><option value="immediate">Immediately after submit</option><option value="faculty_only">Faculty only</option></select>
<div class="two"><label><input type="checkbox" id="shuffleQuestions"> Shuffle questions</label><label><input type="checkbox" id="shuffleOptions"> Shuffle options</label></div>
<div class="integrity-settings"><label><input type="checkbox" id="monitorFocus"> Monitor tab/window switching</label><div id="focusMonitorSettings" hidden><label>Auto-submit after tab/window warnings</label><input class="input" id="focusWarningLimit" type="number" min="1" max="10" value="3"></div></div>
<div class="actions"><button class="btn primary" id="saveQuizBtn">Save Quiz Settings</button><a class="btn ghost" id="controlLink">Control Page</a></div></section>
<section class="panel col-7"><div class="section-head"><div><h2>Questions</h2><p class="muted">Add, edit or remove questions until the quiz starts.</p></div><div class="actions compact"><a class="btn teal" id="bankShortcut" href="bank.html">Question Bank</a><button class="btn gold" id="newQuestionBtn">+ Add Question</button></div></div><div id="questionList">Loading…</div></section>
<section class="panel col-12" id="editorPanel"><h2 id="editorTitle">Add Question</h2>
<div class="two"><div><label>Question type</label><select id="qType"><option value="single_mcq">Single Answer MCQ</option><option value="multiple_mcq">Multiple Answer MCQ</option><option value="true_false">True / False</option></select></div><div><label for="qImageFile">Upload question image <span class="muted">(optional)</span></label><input class="input" id="qImageFile" type="file" accept="image/png,image/jpeg,image/webp"><p class="muted image-upload-help">PNG, JPEG or WebP, up to 5 MB.</p><div id="qImageUploadStatus" role="status"></div><label for="qImage">Or paste an image URL</label><input class="input" id="qImage" type="url" placeholder="https://.../diagram.png"></div></div><div id="qImagePreview"></div>
<label>Question</label><textarea id="qText"></textarea><div class="two"><div><label>Marks for correct answer</label><input class="input" id="qMarks" type="number" min="1" max="100" value="1"></div><div><label>Negative marks for wrong answer</label><input class="input" id="qNegative" type="number" min="0" max="100" step="0.25" value="0"></div></div>
<div id="qTypeNote"></div><div id="optionEditor"></div><div class="actions"><button class="btn ghost" id="addOptionBtn">+ Option</button><button class="btn teal" id="saveQuestionBtn">Save Question</button><button class="btn ghost" id="cancelEditBtn">Cancel</button></div></section>
</div></main>
<script src="../quiz-common.js?v=15"></script><script src="image-upload.js?v=15"></script><script src="edit.js?v=15"></script>
</body></html>
